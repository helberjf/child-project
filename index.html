<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pegue o Monstrinho</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>👾 Pegue o Monstrinho!</h1>

    <p>Pontos: <span id="pontos">0</span></p>

    <div id="escolher-personagem">
        <p>Escolha seu personagem:</p>

        <button onclick="trocarMonstro('👾')">👾</button>
        <button onclick="trocarMonstro('🐲')">🐲</button>
        <button onclick="trocarMonstro('👻')">👻</button>
        <button onclick="trocarMonstro('🦖')">🦖</button>
        <button onclick="trocarMonstro('🐸')">🐸</button>
    </div>

    <button id="monstro">
        👾
    </button>

    <script src="script.js"></script>

</body>
</html>
